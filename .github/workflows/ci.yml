name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain C++ (g++ e gdb)
        run: sudo apt-get update && sudo apt-get install -y g++ gdb
      - name: Dependências Python
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Testes (motor + UI)
        run: pytest -q
      - name: Harness visual (rótulos, viewport, console)
        run: python tools/capture.py shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: build/capture/
